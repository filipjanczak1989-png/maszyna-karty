<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>galeria 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{font:14px system-ui;background:#05070c;color:#cfd6de;margin:0;padding:20px}
h1{color:#f0d9a8}.stan{color:#8793a3;margin-bottom:16px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
figure{margin:0;background:#0b1322;border:1px solid #3a4556;border-radius:6px;padding:10px;position:relative}
model-viewer{width:100%;height:300px;background:#121c30;border-radius:4px}
.brak{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#c9973e;font-size:12px}
.nr{position:absolute;top:4px;left:4px;background:#000a;color:#d8b26a;padding:1px 6px;border-radius:3px;font-size:11px;z-index:1}
figcaption{font-size:12px;color:#8793a3;margin-top:8px}</style></head>
<body><h1>galeria 3D — tura kompletna</h1><p class="stan">obracaj mysza/palcem; auto-rotate wlaczony</p>
<div class="siatka"><figure><span class="nr">#1</span><model-viewer src="3d-palac.glb" alt="3d-palac" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
      <figcaption><b>3d-palac</b><br>64712 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#2</span><model-viewer src="3d-obserwatorium.glb" alt="3d-obserwatorium" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>

      <figcaption><b>3d-oranzeria</b><br>115960 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#4</span><model-viewer src="3d-latarnia.glb" alt="3d-latarnia" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
      <figcaption><b>3d-latarnia</b><br>80904 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#5</span><model-viewer src="3d-wieza-portu.glb" alt="3d-wieza-portu" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
      <figcaption><b>3d-wieza-portu</b><br>89084 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#6</span><model-viewer src="3d-stadion.glb" alt="3d-stadion" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>

<figure><span class="nr">#7</span><model-viewer src="3d-sterowiec.glb" alt="3d-sterowiec" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>

<figure><span class="nr">#8</span><model-viewer src="3d-pomnik-kolonii.glb" alt="3d-pomnik-kolonii" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>

      <figcaption><b>3d-stacja-orbitalna</b><br>68512 B · 30 kredytow</figcaption></figure>

      <figcaption><b>3d-kawiarnia</b><br>90304 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#15</span><model-viewer src="3d-taksowka.glb" alt="3d-taksowka" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
      <figcaption><b>3d-taksowka</b><br>113924 B · 30 kredytow</figcaption></figure></div></body></html>
