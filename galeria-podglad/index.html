<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>galeria 3D — 7 nowych lokali (podglad tymczasowy)</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{font:14px system-ui;background:#05070c;color:#cfd6de;margin:0;padding:20px}
h1{color:#f0d9a8}.stan{color:#8793a3;margin-bottom:16px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
figure{margin:0;background:#0b1322;border:1px solid #3a4556;border-radius:6px;padding:10px;position:relative}
model-viewer{width:100%;height:300px;background:#121c30;border-radius:4px}
.nr{position:absolute;top:4px;left:4px;background:#000a;color:#d8b26a;padding:1px 6px;border-radius:3px;font-size:11px;z-index:1}
figcaption{font-size:12px;color:#8793a3;margin-top:8px}</style></head>
<body><h1>galeria 3D — 7 nowych lokali (podglad tymczasowy)</h1>
<p class="stan">obracaj mysza/palcem; auto-rotate wlaczony. Modele ozdobne, zero danych rejestru. Strona tymczasowa, do usuniecia po przegladzie.</p>
<div class="siatka">
<figure><span class="nr">#1</span><model-viewer src="3d-restauracja.glb" alt="3d-restauracja" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>restauracja</b><br>64020 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#2</span><model-viewer src="3d-sklep.glb" alt="3d-sklep" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>sklep</b><br>62408 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#3</span><model-viewer src="3d-silownia.glb" alt="3d-silownia" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>silownia</b><br>74504 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#4</span><model-viewer src="3d-szkola.glb" alt="3d-szkola" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>szkola</b><br>77020 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#5</span><model-viewer src="3d-hotel.glb" alt="3d-hotel" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>hotel</b><br>53868 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#6</span><model-viewer src="3d-centrum.glb" alt="3d-centrum" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>centrum</b><br>102148 B · 30 kredytow</figcaption></figure>
<figure><span class="nr">#7</span><model-viewer src="3d-kino.glb" alt="3d-kino" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  <figcaption><b>kino</b><br>71384 B · 30 kredytow</figcaption></figure>
</div>
</body></html>
