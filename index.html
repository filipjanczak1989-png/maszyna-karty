<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE MACHINE - karty tokenow</title><style>body{background:#0b0d10;color:#e6e6e6;font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}h1{font-size:20px;letter-spacing:2px}.sub{color:#8a8f98;font-size:13px;margin-bottom:20px}input{width:100%;padding:12px;background:#15181d;border:1px solid #2a2f37;color:#e6e6e6;border-radius:8px;font-size:15px;font-family:ui-monospace,monospace}#wyniki{margin-top:14px}a{display:block;padding:10px 12px;margin:6px 0;background:#15181d;border:1px solid #2a2f37;border-radius:8px;color:#e6e6e6;text-decoration:none}a:hover{border-color:#4a90d9}.sym{font-weight:600}.adr{color:#8a8f98;font-family:ui-monospace,monospace;font-size:12px}.tag{font-size:11px;color:#8a8f98;text-transform:uppercase}.info{color:#8a8f98;font-size:13px}</style></head><body><h1>THE MACHINE</h1><div class="sub">karty tokenow z wyrokiem ostatecznym - read only, nie porada inwestycyjna</div><input id="q" placeholder="wpisz adres lub symbol..." autocomplete="off"><div id="wyniki"><div class="info">wpisz min. 3 znaki</div></div><script>let D=[];fetch('lista.json').then(r=>r.json()).then(j=>{D=j});const q=document.getElementById('q'),w=document.getElementById('wyniki');q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(s.length<3){w.innerHTML='<div class=info>wpisz min. 3 znaki</div>';return}const r=D.filter(t=>t.a.includes(s)||t.y.toLowerCase().includes(s)).slice(0,50);if(!r.length){w.innerHTML='<div class=info>brak - token moze nie miec jeszcze wyroku ostatecznego (sprawdz /token w bocie)</div>';return}w.innerHTML=r.map(t=>'<a href="token/'+t.s+'/'+t.a+'.html"><span class=sym>'+(t.y||'?')+'</span> <span class=tag>'+t.s+' - '+t.w+'</span><br><span class=adr>'+t.a+'</span></a>').join('')});</script></body></html>
