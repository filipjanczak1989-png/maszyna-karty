<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>galeria 3D — podglad</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
body{font:14px system-ui;background:#05070c;color:#cfd6de;margin:0;padding:20px}
h1{color:#f0d9a8}.stan{color:#8793a3;margin-bottom:16px}
.siatka{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
figure{margin:0;background:#0b1322;border:1px solid #3a4556;border-radius:6px;padding:10px}
model-viewer{width:100%;height:340px;background:#121c30;border-radius:4px}
figcaption{font-size:12px;color:#8793a3;margin-top:8px}
</style>
</head>
<body>
<h1>galeria 3D — podglad tury 2</h1>
<p class="stan">obracaj mysza/palcem; auto-rotate wlaczony</p>
<div class="siatka">
  <figure>
    <model-viewer src="obserwatorium-mala.glb" alt="obserwatorium (skompresowane)" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
    <figcaption><b>obserwatorium — po kompresji</b><br>83 080 B (512px JPEG q70 + Draco)</figcaption>
  </figure>
  <figure>
    <model-viewer src="obserwatorium.glb" alt="obserwatorium (oryginal)" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
    <figcaption><b>obserwatorium — oryginal (bez kompresji)</b><br>2 099 964 B, do porownania jakosci</figcaption>
  </figure>
</div>
</body>
</html>
