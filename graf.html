<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa narodzin i wyroków</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Spectral:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --tlo-1:#13213a; --tlo-2:#0a1222; --tlo-3:#04070d;
  --tekst:#d6dde6; --cichy:#8793a3; --linia:rgba(214,221,230,.16);
  --swiezy:#dfe8f2; --zywy:#c9973e; --popiol:#5a6068; --nieokr:#7899b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--tekst);
  font:400 15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:var(--tlo-3) radial-gradient(ellipse 120% 90% at 50% 36%,var(--tlo-1) 0%,var(--tlo-2) 42%,var(--tlo-3) 100%) fixed}
#scena{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}

.naglowek{position:absolute;left:0;top:0;max-width:640px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0 20px}
h1{font:500 clamp(26px,5.2vw,42px)/1.08 Spectral,Georgia,"Times New Roman",serif;margin:0;letter-spacing:.005em}
.podtytul{margin:6px 0 12px;color:var(--cichy);font-size:14px}
.sceny{display:flex;flex-wrap:wrap;gap:6px}
.sceny button{font:inherit;font-size:14px;color:var(--cichy);background:transparent;border:1px solid var(--linia);
  border-radius:6px;padding:6px 12px;cursor:pointer}
.sceny button[aria-pressed="true"]{color:var(--tekst);border-color:var(--zywy)}

.panel{position:absolute;left:0;right:0;bottom:0;
  padding:28px 20px calc(env(safe-area-inset-bottom,0px) + 14px) 20px;
  background:linear-gradient(to top,rgba(4,7,13,.92) 0%,rgba(4,7,13,.78) 70%,rgba(4,7,13,0) 100%)}
.panel-srodek{max-width:760px}
.licznik{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.licznik li{display:flex;align-items:baseline;gap:7px;color:var(--cichy);font-size:14px}
.licznik b{color:var(--tekst);font-weight:500;font-size:17px}
.kropka{width:9px;height:9px;border-radius:50%;align-self:center;flex:none}
.k-urodzone{border:1px solid var(--cichy)}
.k-w_pomiarze{background:var(--swiezy);box-shadow:0 0 8px rgba(223,232,242,.7)}
.k-zywy{background:var(--zywy);box-shadow:0 0 8px rgba(201,151,62,.8)}
.k-popiol{background:var(--popiol)}
.k-nieokreslony{background:var(--nieokr);opacity:.75}

.os{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#graj{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--linia);background:rgba(214,221,230,.06);
  color:var(--tekst);display:grid;place-items:center;cursor:pointer;padding:0}
#graj svg{width:18px;height:18px;fill:currentColor}
#suwak{flex:1;min-width:0;height:28px;accent-color:var(--zywy);cursor:pointer}
.data{margin:0 auto 0 0;color:var(--cichy);font-size:13px;font-variant-numeric:tabular-nums}
.data b{color:var(--tekst);font-weight:500}

.opcje{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--cichy)}
.opcje select,.opcje button{font:inherit;color:var(--tekst);background:rgba(214,221,230,.06);border:1px solid var(--linia);
  border-radius:6px;padding:5px 8px;cursor:pointer}
.opcje label{display:flex;gap:8px;align-items:center}
.legenda,.stopka{margin:0;color:var(--cichy);font-size:12.5px;max-width:68ch}
.stopka{margin-top:4px}
#samotest.zle{color:#e4b36a}
.jak{margin:2px 0 0;color:var(--cichy);font-size:12.5px;max-width:68ch}
.jak summary{cursor:pointer;width:max-content;padding:2px 0}
.jak p{margin:6px 0 0}

button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--zywy);outline-offset:2px}

.karta{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 18px);width:min(300px,calc(100% - 32px));
  padding:14px 16px 12px;background:rgba(5,9,17,.82);border:1px solid var(--linia);border-radius:8px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.karta[hidden]{display:none}
.karta-zamknij{position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;background:transparent;color:var(--cichy);
  font-size:20px;line-height:1;cursor:pointer;border-radius:6px}
.karta-zamknij:hover{color:var(--tekst)}
.karta-tytul{margin:0 28px 8px 0;font:500 17px/1.3 Spectral,Georgia,serif;display:flex;align-items:center;gap:8px}
.karta-dane{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.karta-dane dt{color:var(--cichy)}
.karta-dane dd{margin:0;color:var(--tekst);overflow-wrap:anywhere}
@media (max-width:560px){
  .karta{right:12px;left:12px;top:auto;bottom:calc(var(--panel-h,260px) + 8px);width:auto}
}
.komunikat{position:absolute;left:20px;right:20px;top:45%;text-align:center;color:var(--cichy);font-size:15px}

@media (max-width:560px){
  .naglowek{padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
  .podtytul{margin:4px 0 8px;font-size:13px}
  .sceny button{padding:5px 11px;font-size:13px}
  .panel{padding-top:22px}
  .licznik{gap:2px 12px;margin-bottom:8px}
  .licznik li{font-size:13px;gap:5px}
  .licznik b{font-size:15px}
  #graj{width:40px;height:40px}
  .data{flex-basis:100%}
  .opcje{margin-bottom:6px;gap:6px 10px;font-size:12.5px}
  .opcje select,.opcje button{padding:4px 7px}
}
</style>
</head>
<body>
<main id="scena" aria-label="Mapa narodzin i wyroków tokenów w czasie">
  <canvas id="plotno" aria-hidden="true"></canvas>
  <p class="komunikat" id="komunikat">Wczytuję dane…</p>

  <aside class="karta" id="karta" hidden>
    <button class="karta-zamknij" id="kartaZamknij" type="button" aria-label="Zamknij kartę">×</button>
    <p class="karta-tytul" id="kartaTytul"></p>
    <dl class="karta-dane" id="kartaDane"></dl>
  </aside>

  <header class="naglowek">
    <h1 id="tytul">&nbsp;</h1>
    <p class="podtytul" id="podtytul">&nbsp;</p>
    <nav class="sceny" id="sceny" aria-label="Wybór sceny"></nav>
  </header>

  <section class="panel" id="panel" aria-label="Oś czasu">
    <div class="panel-srodek">
      <ul class="licznik" id="licznik">
        <li><span class="kropka k-urodzone"></span>urodzone <b data-k="urodzone">0</b></li>
        <li><span class="kropka k-w_pomiarze"></span>w pomiarze <b data-k="w_pomiarze">0</b></li>
        <li><span class="kropka k-zywy"></span>żywe <b data-k="zywy">0</b></li>
        <li><span class="kropka k-popiol"></span>popiół <b data-k="popiol">0</b></li>
        <li><span class="kropka k-nieokreslony"></span>nieokreślone <b data-k="nieokreslony">0</b></li>
      </ul>
      <div class="os">
        <button id="graj" type="button" aria-label="Odtwórz"></button>
        <input id="suwak" type="range" min="0" max="1" step="0.01" value="0" aria-label="Czas">
      </div>
      <div class="opcje">
        <p class="data" id="data">&nbsp;</p>
        <label>Tempo
          <select id="tempo">
            <option value="5">doba w 5 s</option>
            <option value="10" selected>doba w 10 s</option>
            <option value="30">doba w 30 s</option>
          </select>
        </label>
        <button id="dzwiek" type="button" aria-pressed="false">Dźwięk: wyłączony</button>
      </div>
      <p class="legenda">Kolor to rzadkość stanu, nie ocena.</p>
      <details class="jak">
        <summary>Jak czytać mapę</summary>
        <p id="legenda"></p>
        <p id="zrodlo"></p>
      </details>
      <p class="stopka" id="samotest"></p>
      <p class="stopka">to nie jest porada inwestycyjna — to jest mapa</p>
    </div>
  </section>
</main>

    function wybierzToken(cx, cy) {
      var rect = plotno.getBoundingClientRect();
      var ndc = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
      raycaster.setFromCamera(ndc, kamera);
      raycaster.params.Points.threshold = dystans * 0.022;
      var trafienia = raycaster.intersectObject(obiekty[aktywna].punkty, false);
      var najlepsze = null;
      trafienia.forEach(function (h) {
        var tok = sc.tokeny[h.index];
        if (!tok || T < tok.tn) return;
        if (!najlepsze || h.distanceToRay < najlepsze.distanceToRay) najlepsze = { distanceToRay: h.distanceToRay, token: tok };
      });
      wybrany = najlepsze ? { scena: aktywna, token: najlepsze.token } : null;
      pokazKarte();
    }

    // ---------- licznik i data ----------
    var pola = {};
    Array.prototype.forEach.call(document.querySelectorAll('#licznik b'), function (b) { pola[b.dataset.k] = b; });
    var ostatnieLiczby = '', ostatniaData = '';
    function odswiez(wymus) {
      var c = M.policz(sc, T);
      var klucz = JSON.stringify(c);
      if (wymus || klucz !== ostatnieLiczby) {
        Object.keys(c).forEach(function (k) { pola[k].textContent = c[k]; });
        ostatnieLiczby = klucz;
        if (wybrany) pokazKarte();
      }
      var dzien = Math.min(Math.floor(T), Math.ceil(sc.koniec) - 1);
      var napis = 'doba <b>' + (dzien + 1) + '</b> z ' + Math.ceil(sc.koniec) + ', ' + formatDaty(sc.startMs + dzien * M.DOBA) +
        (T >= sc.koniec - 1e-6 ? ', stan końcowy' : '');
      if (wymus || napis !== ostatniaData) {
        $('data').innerHTML = napis;
        suwak.setAttribute('aria-valuetext', napis.replace(/<\/?b>/g, ''));
        ostatniaData = napis;
      }
      if (!przeciaganie) suwak.value = T.toFixed(2);
    }

    // ---------- dzwiek ----------
    var audio = null, dzwiekOn = false, ostatniTik = 0;
    $('dzwiek').addEventListener('click', function () {
      dzwiekOn = !dzwiekOn;
      if (dzwiekOn && !audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
      this.setAttribute('aria-pressed', dzwiekOn ? 'true' : 'false');
      this.textContent = 'Dźwięk: ' + (dzwiekOn ? 'włączony' : 'wyłączony');
    });
    function tik() {
      if (!audio) return;
      var t0 = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = 1320;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 0.06);
    }

    // ---------- sterowanie ----------
    graj.addEventListener('click', function () {
      ruszal = true;
      if (!gra && T >= sc.koniec - 1e-6) T = 0;
      ustawGraj(!gra);
    });
    $('tempo').addEventListener('change', function () { tempo = +this.value; });
    var przeciaganie = false;
    suwak.addEventListener('input', function () { ruszal = true; przeciaganie = true; T = +suwak.value; ustawGraj(false); odswiez(); });
    suwak.addEventListener('change', function () { przeciaganie = false; });
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); graj.click(); }
    });

    // obracanie i przyblizanie
    var wskazniki = {}, przesuniecie = 0;
    plotno.addEventListener('pointerdown', function (e) {
      plotno.setPointerCapture(e.pointerId);
      wskazniki[e.pointerId] = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY };
      przesuniecie = 0; yawV = 0; pitchV = 0; ostatniRuch = performance.now();
    });
    plotno.addEventListener('pointermove', function (e) {
      var p = wskazniki[e.pointerId]; if (!p) return;
      var ids = Object.keys(wskazniki);
      if (ids.length === 1) {
        var dx = (e.clientX - p.x), dy = (e.clientY - p.y);
        yaw -= dx * 0.006; yawV = -dx * 0.006;
        pitch = Math.max(0.08, Math.min(1.45, pitch + dy * 0.004)); pitchV = dy * 0.004;
        przesuniecie += Math.abs(dx) + Math.abs(dy);
      } else if (ids.length === 2) {
        var a = wskazniki[ids[0]], b = wskazniki[ids[1]];
        var przed = Math.hypot(a.x - b.x, a.y - b.y);
        p.x = e.clientX; p.y = e.clientY;
        var po = Math.hypot(wskazniki[ids[0]].x - wskazniki[ids[1]].x, wskazniki[ids[0]].y - wskazniki[ids[1]].y);
        if (przed > 0) dystans = Math.max(dystansBazowy * 0.45, Math.min(dystansBazowy * 2, dystans * przed / po));
      }
      p.x = e.clientX; p.y = e.clientY;
      ostatniRuch = performance.now();
    });
    function puszczone(e) {
      var p = wskazniki[e.pointerId];
      delete wskazniki[e.pointerId]; ostatniRuch = performance.now();
      if (p && przesuniecie < 8 && e.type === 'pointerup') wybierzToken(e.clientX, e.clientY);
    }
    plotno.addEventListener('pointerup', puszczone);
    plotno.addEventListener('pointercancel', puszczone);
    plotno.addEventListener('wheel', function (e) {
      e.preventDefault();
      dystans = Math.max(dystansBazowy * 0.45, Math.min(dystansBazowy * 2, dystans * Math.exp(e.deltaY * 0.001)));
      ostatniRuch = performance.now();
    }, { passive: false });

    // ---------- rozmiar ----------
    function rozmiar() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      if (composer) { composer.setPixelRatio(px); composer.setSize(w, h); }
      var aspekt = w / h;
      kamera.aspect = aspekt;
      var polowaV = THREE.MathUtils.degToRad(kamera.fov / 2);
      var polowaH = Math.atan(Math.tan(polowaV) * aspekt);
      var panelH = $('panel').offsetHeight, naglH = document.querySelector('.naglowek').offsetHeight;
      document.documentElement.style.setProperty('--panel-h', panelH + 'px');
      var wolne = Math.max(160, h - panelH - naglH - 16);
      var wysokosc = 2 * R * Math.sin(pitch) + 3.5;                // pionowy zasieg pierscienia w jednostkach sceny
      var dPion = (wysokosc / 2) / Math.tan(polowaV) * (h / wolne);
      var dPoziom = (R * 1.3) / Math.tan(polowaH);
      var nowy = Math.max(dPion, dPoziom, 22);
      dystans = dystans / dystansBazowy * nowy; dystansBazowy = nowy;
      var przesun = (panelH - naglH) * 0.5;
      kamera.setViewOffset(w, h, 0, przesun, w, h);
      kamera.updateProjectionMatrix();
    }
    window.addEventListener('resize', rozmiar);

    // ---------- petla ----------
    var poprz = performance.now();
    function klatka(teraz) {
      var dt = Math.min(0.1, (teraz - poprz) / 1000); poprz = teraz;
      var Tprzed = T;
      if (gra) {
        T += dt / tempo;
        if (T >= sc.koniec) { T = sc.koniec; ustawGraj(false); }
        if (dzwiekOn && teraz - ostatniTik > 90) {
          for (var k = 0; k < sc.tokeny.length; k++) { var tn = sc.tokeny[k].tn; if (tn > Tprzed && tn <= T) { tik(); ostatniTik = teraz; break; } }
        }
      }
      if (!Object.keys(wskazniki).length) {
        yaw += yawV; pitch = Math.max(0.08, Math.min(1.45, pitch + pitchV));
        yawV *= 0.9; pitchV *= 0.85;
        if (Math.abs(yawV) < 1e-5) yawV = 0;
        if (Math.abs(pitchV) < 1e-5) pitchV = 0;
      }
      if (!ZMIANA_OBRAZU && teraz - ostatniRuch > 5000) yaw += dt * (2 * Math.PI / 90) * Math.min(1, (teraz - ostatniRuch - 5000) / 2000);

      var o = obiekty[aktywna], u = o.punkty.material.uniforms;
      u.uT.value = T;
      u.uFade.value = 1.5 / tempo;
      u.uFlash.value = gra ? 0.3 / tempo : 0.0;
      u.uMglaBlisko.value = dystans - R * 0.6;
      u.uMglaDaleko.value = dystans + R * 1.4;
      var wsk = o.tarcza.userData.wskazowka;
      wsk.rotation.y = -(2 * Math.PI * T / o.tarcza.userData.span - Math.PI / 2);

      kamera.position.set(Math.cos(yaw) * Math.cos(pitch) * dystans, Math.sin(pitch) * dystans, Math.sin(yaw) * Math.cos(pitch) * dystans);
      kamera.lookAt(0, 0.2, 0);
      znacznikWybranego();
      if (composer) { wykonczenie.uniforms.uCzas.value = (teraz / 1000) % 100; composer.render(); }
      else renderer.render(swiat, kamera);
      odswiez(false);
      requestAnimationFrame(klatka);
    }

    komunikat.remove();
    wybierz(0);
    rozmiar();
    ustawGraj(false);
    if (ZMIANA_OBRAZU) { T = sc.koniec; odswiez(true); }
    else setTimeout(function () { if (!ruszal) ustawGraj(true); }, 700);
    requestAnimationFrame(klatka);
  }).catch(function (e) {
    blad(e);
    komunikat.textContent = 'Nie udało się zbudować mapy: ' + e.message;
  });
})();
</script>
</body>
</html>
