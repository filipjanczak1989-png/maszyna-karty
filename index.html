<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE MACHINE - karty tokenow</title><style>body{background:#0b0d10;color:#e6e6e6;font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px}h1{font-size:20px;letter-spacing:2px}.sub{color:#8a8f98;font-size:13px;margin-bottom:16px}.staty{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.stat{flex:1;min-width:150px;background:#15181d;border:1px solid #2a2f37;border-radius:8px;padding:12px}.liczba{font-size:20px;font-weight:600}.etyk{color:#8a8f98;font-size:12px;text-transform:uppercase;margin-top:4px}.n{color:#8a8f98;font-weight:400;font-size:13px}.sep{color:#4a5563}input{width:100%;padding:12px;background:#15181d;border:1px solid #2a2f37;color:#e6e6e6;border-radius:8px;font-size:15px;font-family:ui-monospace,monospace}#wyniki{margin-top:14px}a{display:block;padding:10px 12px;margin:6px 0;background:#15181d;border:1px solid #2a2f37;border-radius:8px;color:#e6e6e6;text-decoration:none}a:hover{border-color:#4a90d9}.sym{font-weight:600}.adr{color:#8a8f98;font-family:ui-monospace,monospace;font-size:12px}.tag{font-size:11px;color:#8a8f98;text-transform:uppercase}.info{color:#8a8f98;font-size:13px}.stopka{color:#4a5563;font-size:12px;margin-top:20px}.szukaj{display:flex;gap:8px;align-items:stretch}.szukaj input{flex:1}.mapa{display:flex;align-items:center;padding:0 16px;background:#15181d;border:1px solid #2a2f37;border-radius:8px;color:#7899b8;text-decoration:none;font-size:14px;white-space:nowrap}.mapa:hover{border-color:#4a90d9}</style></head><body><h1>THE MACHINE</h1><div class="sub">karty tokenow z wyrokiem ostatecznym - read only, nie porada inwestycyjna</div><div class="staty"><div class="stat"><div class="liczba">64580</div><div class="etyk">tokeny zmierzone</div></div><div class="stat"><div class="liczba">45558</div><div class="etyk">z wyrokiem ostatecznym</div></div><div class="stat"><div class="liczba">1.5% <span class="n">(n=15227)</span> <span class="sep">·</span> 3% <span class="n">(n=28324)</span></div><div class="etyk">przezycie base · bsc</div></div></div><div class="szukaj"><input id="q" placeholder="wpisz adres lub symbol..." autocomplete="off"><a class="mapa" href="graf.html">mapa operatorow</a></div><div id="wyniki"><div class="info">wpisz min. 3 znaki</div></div><div class="stopka">liczby policzone ze zrodel maszyny 2026-09-25 UTC</div><script>let D=[];fetch('lista.json').then(r=>r.json()).then(j=>{D=j});const q=document.getElementById('q'),w=document.getElementById('wyniki');q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(s.length<3){w.innerHTML='<div class=info>wpisz min. 3 znaki</div>';return}const r=D.filter(t=>t.a.includes(s)||t.y.toLowerCase().includes(s)).slice(0,50);if(!r.length){w.innerHTML='<div class=info>brak - token moze nie miec jeszcze wyroku ostatecznego (sprawdz /token w bocie)</div>';return}w.innerHTML=r.map(t=>'<a href="token/'+t.s+'/'+t.a+'.html"><span class=sym>'+(t.y||'?')+'</span> <span class=tag>'+t.s+' - '+t.w+'</span><br><span class=adr>'+t.a+'</span></a>').join('')});</script></body></html>
